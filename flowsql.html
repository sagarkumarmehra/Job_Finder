<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowSQL — Visual Data Pipeline Designer</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --apple-blue: #0071e3;
    --apple-blue-hover: #0077ed;
    --apple-blue-light: rgba(0,113,227,0.12);
    --apple-bg: #ffffff;
    --apple-surface: #f5f5f7;
    --apple-surface-2: #e8e8ed;
    --apple-border: rgba(0,0,0,0.08);
    --apple-text: #1d1d1f;
    --apple-secondary: #86868b;
    --apple-tertiary: #ababab;
    --apple-shadow-sm: 0 2px 8px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(0,0,0,0.06);
    --apple-shadow-md: 0 4px 20px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.06);
    --apple-shadow-lg: 0 12px 40px rgba(0,0,0,0.16), 0 0 0 0.5px rgba(0,0,0,0.06);
    --canvas-bg: #111114;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "Cascadia Code", Menlo, monospace;
  }

  html, body, #root {
    height: 100%;
    font-family: var(--font);
    background: var(--apple-bg);
    color: var(--apple-text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ── Scrollbars ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--apple-surface-2); border-radius: 3px; }

  /* ── Toolbar ── */
  .toolbar {
    height: 52px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--apple-border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    position: relative;
    z-index: 100;
    flex-shrink: 0;
  }

  .toolbar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }

  .logo-mark {
    width: 28px;
    height: 28px;
    background: var(--apple-text);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--apple-text);
  }

  .pipeline-name-wrap {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pipeline-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--apple-text);
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    letter-spacing: -0.1px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s;
    width: 200px;
    cursor: text;
  }

  .pipeline-name:hover { background: var(--apple-surface); }
  .pipeline-name:focus { background: var(--apple-surface); }

  .pipeline-badge {
    font-size: 10px;
    font-weight: 500;
    background: #34c759;
    color: white;
    padding: 2px 7px;
    border-radius: 10px;
    letter-spacing: 0.2px;
  }

  .toolbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: flex-end;
  }

  .btn {
    height: 30px;
    padding: 0 14px;
    border-radius: 15px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 5px;
    letter-spacing: -0.1px;
    font-family: var(--font);
  }

  .btn-primary {
    background: var(--apple-blue);
    color: white;
  }
  .btn-primary:hover { background: var(--apple-blue-hover); transform: scale(1.02); }
  .btn-primary:active { transform: scale(0.98); }

  .btn-secondary {
    background: transparent;
    color: var(--apple-text);
    border: 1px solid var(--apple-border);
  }
  .btn-secondary:hover { background: var(--apple-surface); }

  .zoom-controls {
    display: flex;
    align-items: center;
    background: var(--apple-surface);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--apple-border);
  }

  .zoom-btn {
    width: 28px;
    height: 28px;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--apple-secondary);
    transition: all 0.15s;
    font-family: var(--font);
  }
  .zoom-btn:hover { background: var(--apple-surface-2); color: var(--apple-text); }

  .zoom-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--apple-secondary);
    padding: 0 6px;
    border-left: 1px solid var(--apple-border);
    border-right: 1px solid var(--apple-border);
    height: 28px;
    display: flex;
    align-items: center;
    letter-spacing: 0.2px;
  }

  /* ── Layout ── */
  .app-body {
    display: flex;
    height: calc(100vh - 52px - 36px);
  }

  /* ── Left Sidebar ── */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--apple-bg);
    border-right: 1px solid var(--apple-border);
    overflow-y: auto;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .sidebar-section-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--apple-tertiary);
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .palette-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 11px;
    border-radius: var(--radius-sm);
    cursor: grab;
    transition: all 0.15s ease;
    border: 1px solid transparent;
    user-select: none;
  }

  .palette-item:hover {
    background: var(--apple-surface);
    border-color: var(--apple-border);
    transform: translateX(2px);
  }

  .palette-item:active {
    cursor: grabbing;
    transform: scale(0.97);
  }

  .palette-icon {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .palette-label {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--apple-text);
    letter-spacing: -0.1px;
  }

  .palette-sublabel {
    font-size: 10px;
    color: var(--apple-secondary);
    margin-top: 1px;
    letter-spacing: 0.1px;
  }

  /* ── Canvas ── */
  .canvas-wrap {
    flex: 1;
    background: var(--canvas-bg);
    position: relative;
    overflow: hidden;
  }

  .canvas-grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
  }

  .canvas-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }

  /* ── Pipeline Nodes ── */
  .pipeline-node {
    position: absolute;
    width: 200px;
    background: #ffffff;
    border-radius: var(--radius-lg);
    box-shadow: var(--apple-shadow-lg);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border: 1.5px solid transparent;
    overflow: hidden;
  }

  .pipeline-node:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 48px rgba(0,0,0,0.22), 0 0 0 0.5px rgba(0,0,0,0.06);
  }

  .pipeline-node.selected {
    border-color: var(--apple-blue);
    box-shadow: 0 0 0 3px rgba(0,113,227,0.2), var(--apple-shadow-lg);
  }

  .node-header {
    padding: 12px 13px 10px;
    display: flex;
    align-items: center;
    gap: 9px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }

  .node-icon-wrap {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .node-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--apple-text);
    letter-spacing: -0.2px;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .node-status-ring {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
  }

  .status-success { background: #34c759; }
  .status-error   { background: #ff3b30; }
  .status-queued  { background: #ababab; }

  .status-running {
    background: var(--apple-blue);
    animation: pulse-ring 1.2s ease-in-out infinite;
  }

  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(0,113,227,0.6); }
    70%  { box-shadow: 0 0 0 6px rgba(0,113,227,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,113,227,0); }
  }

  .node-body {
    padding: 9px 13px;
  }

  .node-desc {
    font-size: 11px;
    color: var(--apple-secondary);
    line-height: 1.4;
    letter-spacing: 0.1px;
  }

  .node-code {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: #6e6e73;
    background: var(--apple-surface);
    border-radius: 5px;
    padding: 5px 8px;
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .node-footer {
    padding: 7px 13px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .node-rows {
    font-size: 10px;
    color: var(--apple-tertiary);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.1px;
  }

  .node-preview-btn {
    font-size: 11px;
    font-weight: 500;
    color: var(--apple-blue);
    background: var(--apple-blue-light);
    border: none;
    border-radius: 5px;
    padding: 3px 9px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font);
    letter-spacing: -0.1px;
  }
  .node-preview-btn:hover { background: rgba(0,113,227,0.2); }

  /* ── Right Panel ── */
  .right-panel {
    width: 300px;
    flex-shrink: 0;
    background: var(--apple-bg);
    border-left: 1px solid var(--apple-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: slide-in 0.25s cubic-bezier(0.2,0,0,1);
  }

  @keyframes slide-in {
    from { transform: translateX(20px); opacity: 0; }
    to   { transform: translateX(0);   opacity: 1; }
  }

  .panel-header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--apple-border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .panel-icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .panel-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--apple-text);
    letter-spacing: -0.3px;
  }

  .panel-subtitle {
    font-size: 11px;
    color: var(--apple-secondary);
    margin-top: 1px;
  }

  .panel-status {
    margin-left: auto;
    font-size: 10.5px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 10px;
    letter-spacing: 0.1px;
  }
  .status-pill-success { background: rgba(52,199,89,0.12); color: #28a745; }
  .status-pill-running { background: rgba(0,113,227,0.12); color: var(--apple-blue); }
  .status-pill-queued  { background: var(--apple-surface);  color: var(--apple-secondary); }

  .panel-tabs {
    display: flex;
    padding: 0 16px;
    border-bottom: 1px solid var(--apple-border);
    flex-shrink: 0;
  }

  .panel-tab {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--apple-secondary);
    padding: 10px 0;
    margin-right: 20px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    letter-spacing: -0.1px;
    background: transparent;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: var(--font);
  }

  .panel-tab:hover { color: var(--apple-text); }

  .panel-tab.active {
    color: var(--apple-blue);
    border-bottom-color: var(--apple-blue);
  }

  .panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .panel-section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--apple-tertiary);
    margin-bottom: 7px;
  }

  .sql-editor {
    background: #0d1117;
    border-radius: var(--radius-sm);
    padding: 12px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.7;
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
  }

  .sql-editor::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--apple-blue);
    opacity: 0.7;
  }

  .sql-kw   { color: #ff7b72; }
  .sql-fn   { color: #d2a8ff; }
  .sql-str  { color: #a5d6ff; }
  .sql-col  { color: #e6edf3; }
  .sql-op   { color: #79c0ff; }
  .sql-num  { color: #f78166; }
  .sql-cmt  { color: #8b949e; }

  .schema-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .schema-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--apple-surface);
    border-radius: 6px;
    padding: 4px 9px;
    border: 1px solid var(--apple-border);
  }

  .chip-name {
    font-size: 11px;
    font-weight: 500;
    color: var(--apple-text);
    font-family: var(--font-mono);
  }

  .chip-type {
    font-size: 9.5px;
    color: var(--apple-blue);
    font-weight: 500;
    font-family: var(--font-mono);
    background: var(--apple-blue-light);
    padding: 1px 5px;
    border-radius: 3px;
  }

  /* ── Data Preview Table ── */
  .preview-table-wrap {
    border-radius: var(--radius-sm);
    border: 1px solid var(--apple-border);
    overflow: hidden;
  }

  .preview-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }

  .preview-table th {
    background: var(--apple-surface);
    padding: 7px 10px;
    text-align: left;
    font-weight: 600;
    color: var(--apple-secondary);
    letter-spacing: 0.2px;
    font-size: 10px;
    border-bottom: 1px solid var(--apple-border);
    white-space: nowrap;
  }

  .preview-table td {
    padding: 6px 10px;
    color: var(--apple-text);
    border-bottom: 1px solid rgba(0,0,0,0.04);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    font-size: 10.5px;
  }

  .preview-table tr:last-child td { border-bottom: none; }
  .preview-table tr:hover td { background: var(--apple-surface); }

  /* ── Bottom Status Bar ── */
  .status-bar {
    height: 36px;
    background: rgba(245,245,247,0.9);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--apple-border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 0;
    flex-shrink: 0;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 16px;
    border-right: 1px solid var(--apple-border);
    height: 100%;
  }

  .status-item:first-child { padding-left: 0; }
  .status-item:last-child  { border-right: none; }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-text {
    font-size: 11.5px;
    color: var(--apple-secondary);
    letter-spacing: -0.1px;
    font-variant-numeric: tabular-nums;
  }

  .status-text strong {
    color: var(--apple-text);
    font-weight: 600;
  }

  .progress-bar-wrap {
    flex: 1;
    height: 3px;
    background: var(--apple-surface-2);
    border-radius: 2px;
    margin: 0 16px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    width: 60%;
    background: linear-gradient(90deg, var(--apple-blue), #34c759);
    border-radius: 2px;
    animation: progress-shimmer 2s ease-in-out infinite;
    background-size: 200% 100%;
  }

  @keyframes progress-shimmer {
    0%   { background-position: -100% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── Connection handle dots ── */
  .handle {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: white;
    border: 2px solid var(--apple-border);
    position: absolute;
    transition: all 0.15s;
  }

  .handle-right {
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
  }

  .handle-left {
    left: -5px;
    top: 50%;
    transform: translateY(-50%);
  }

  .pipeline-node:hover .handle {
    border-color: var(--apple-blue);
    background: var(--apple-blue-light);
  }

  /* ── Canvas mini-map ── */
  .mini-map {
    position: absolute;
    bottom: 16px;
    left: 16px;
    width: 120px;
    height: 72px;
    background: rgba(17,17,20,0.85);
    backdrop-filter: blur(8px);
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
  }

  .mini-viewport {
    position: absolute;
    border: 1px solid rgba(0,113,227,0.5);
    background: rgba(0,113,227,0.08);
    border-radius: 2px;
  }

  /* ── Tooltip ── */
  .canvas-hint {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11.5px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.1px;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ── Divider line ── */
  .sidebar-divider {
    height: 1px;
    background: var(--apple-border);
    margin: 0 4px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

/* ── Icons ── */
const Icon = ({ name, size = 16, color = 'currentColor' }) => {
  const icons = {

/* ── SQL Highlighter ── */
const SqlHighlight = ({ code }) => {
  const lines = code.split('\n');
  const hl = (line) => {
    return line
      .replace(/\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|JOIN|ON|AS|AND|OR|NOT|IN|IS|NULL|LIMIT|INNER|LEFT|RIGHT|FULL|OUTER|UNION|WITH|DISTINCT)\b/g, '<span class="sql-kw">$1</span>')
      .replace(/\b(SUM|COUNT|AVG|MIN|MAX|COALESCE|CAST|ROUND|UPPER|LOWER|TRIM)\b/gi, '<span class="sql-fn">$1</span>')
      .replace(/'[^']*'/g, '<span class="sql-str">$&</span>')
      .replace(/\b(\d+(\.\d+)?)\b/g, '<span class="sql-num">$1</span>')
      .replace(/(>|<|=|>=|<=|<>|\*)/g, '<span class="sql-op">$1</span>');
  };
  return (
    <div className="sql-editor">
      {lines.map((l, i) => (
        <div key={i} dangerouslySetInnerHTML={{ __html: hl(l) || '&nbsp;' }} />
      ))}
    </div>
  );
};

/* ── Bezier Edge ── */
const Edge = ({ nodes, sourceId, targetId }) => {
  const src = nodes.find(n => n.id === sourceId);
  const tgt = nodes.find(n => n.id === targetId);
  if (!src || !tgt) return null;

  const NODE_W = 200, NODE_H = 104;
  const x1 = src.x + NODE_W;
  const y1 = src.y + NODE_H / 2;
  const x2 = tgt.x;
  const y2 = tgt.y + NODE_H / 2;
  const cx1 = x1 + (x2 - x1) * 0.45;
  const cy1 = y1;
  const cx2 = x1 + (x2 - x1) * 0.55;
  const cy2 = y2;

  const isRunning = src.status === 'running' || tgt.status === 'running';
  const isSuccess = src.status === 'success' && (tgt.status === 'success' || tgt.status === 'running');

  return (
    <g>
      <path
        d={`M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`}
        stroke={isSuccess ? '#0071e3' : isRunning ? '#0071e3' : 'rgba(255,255,255,0.12)'}
        strokeWidth={isSuccess || isRunning ? 2 : 1.5}
        fill="none"
        strokeDasharray={tgt.status === 'queued' ? '5 4' : 'none'}
        opacity={tgt.status === 'queued' ? 0.35 : 0.85}
      />
      {/* Arrow head */}
      <circle cx={x2} cy={y2} r={3.5}
        fill={isSuccess || isRunning ? '#0071e3' : 'rgba(255,255,255,0.2)'}
        opacity={tgt.status === 'queued' ? 0.35 : 0.9}
      />
    </g>
  );
};
